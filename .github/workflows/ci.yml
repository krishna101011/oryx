name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: shared-types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drift check
        run: pnpm drift:check

  js:
    name: lint + type-check (JS)
    runs-on: ubuntu-latest
    needs: drift
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  py:
    name: lint + type-check + tests (Python)
    runs-on: ubuntu-latest
    needs: drift
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        # Must be able to read the committed uv.lock (generated with 0.11.x).
        run: pip install uv==0.11.20
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run --no-sync ruff check src tests
      # Mypy is scoped to the Phase 3 strict-clean surface (queue, dedupe,
      # normalization, intake orchestration, credential crypto).
      #
      # PRE-EXISTING DEBT (2026-06-11, Phase 3 freeze): ~220 strict-mode
      # errors live in Phase 1-2 files (routers/models written before strict
      # enforcement was ever executed — this job had no green run on record).
      # Gating on them would either block the freeze or force a rewrite of
      # frozen phases. They are tracked tech debt; widening this scope back
      # to `mypy src` is the burn-down's exit criterion.
      - name: Mypy (Phase 3 strict-clean scope)
        run: >-
          uv run --no-sync mypy --follow-imports=silent
          src/oryx/services/queue
          src/oryx/services/dedupe
          src/oryx/services/claims
          src/oryx/services/evidence
          src/oryx/services/verification
          src/oryx/services/conflicts
          src/oryx/services/review
          src/oryx/services/intelligence
          src/oryx/services/research
          src/oryx/services/drafts
          src/oryx/services/admin
          src/oryx/core/scoring_version.py
          src/oryx/core/ai_circuit_breaker.py
          src/oryx/services/normalization
          src/oryx/services/intake/scheduler.py
          src/oryx/services/intake/sync_runner.py
          src/oryx/services/intake/workspace_cascade.py
          src/oryx/services/intake/admin_router.py
          src/oryx/core/security/secrets.py
      - name: Pytest
        run: uv run --no-sync pytest -q
