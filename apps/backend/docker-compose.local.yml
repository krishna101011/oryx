services:
  db:
    # Matches the default DATABASE_URL in config.py:
    #   postgresql+asyncpg://anant:anant@localhost:5432/anant
    image: postgres:16
    environment:
      POSTGRES_USER: anant
      POSTGRES_PASSWORD: anant
      POSTGRES_DB: anant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anant -d anant"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://anant:anant@db:5432/anant
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn anant.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
