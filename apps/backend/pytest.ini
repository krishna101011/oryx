[pytest]
asyncio_mode = auto
; One event loop for the whole run: core/db.py holds a module-global async
; engine, and per-test loops would hand later tests pooled asyncpg
; connections bound to an already-closed loop.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
markers =
    requires_db: integration test that needs a reachable Postgres (skipped when ORYX_TEST_DB is unset)
    requires_network: test that makes a real outbound HTTP call to a live third-party endpoint (skipped unless ORYX_ALLOW_NETWORK_TESTS=1)
    security: security pass test (lockout, rate limit, redaction)
