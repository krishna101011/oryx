[project]
name = "oryx-backend"
version = "0.1.0"
description = "ORYX backend — FastAPI service-oriented"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "structlog>=24.1.0",
  "python-json-logger>=2.0.7",
  # Phase 2
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.8.0",
  "slowapi>=0.1.9",
  # Phase 3 Batch 2 — intake providers
  "httpx>=0.27.0",
  "feedparser>=6.0.10",
  # Phase 3 — credentials envelope encryption (core/security/secrets.py)
  "cryptography>=42.0.0",
  # Windows has no system IANA tz database; dedupe date-bucketing needs one.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",  # for tests against in-memory SQLite
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oryx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
